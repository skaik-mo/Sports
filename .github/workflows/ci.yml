name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:

  domain:
    name: Domain Module
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            Build/SourcePackages
            Build/DerivedData
          key: ${{ runner.os }}-spm-v1-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-v1-

      - name: Run Domain Pipeline
        run: bundle exec fastlane ios ci_domain

  data:
    name: Data Module
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            Build/SourcePackages
            Build/DerivedData
          key: ${{ runner.os }}-spm-v1-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-v1-

      - name: Run Data Pipeline
        run: bundle exec fastlane ios ci_data

  presentation:
    name: Presentation Module
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            Build/SourcePackages
            Build/DerivedData
          key: ${{ runner.os }}-spm-v1-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-v1-

      - name: Run Presentation Pipeline
        run: bundle exec fastlane ios ci_presentation

  build:
    name: Full App Build
    runs-on: macos-15
    needs: [domain, data, presentation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            Build/SourcePackages
            Build/DerivedData
          key: ${{ runner.os }}-spm-v1-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-v1-

      - name: Build Full App
        run: bundle exec fastlane ios build_main_app
